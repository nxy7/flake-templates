<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#f5efe3" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Notebook</title>
    <meta name="description" content="Notes in the browser, on Android and iOS." />
    <!-- Prerenderowany HTML jest właściwy tylko dla swojej ścieżki. Na innej (fallback SPA)
         ukrywamy go do czasu renderu klienta, żeby nie mignęła treść strony marketingowej. -->
    <script>
      (() => {
        var r = document.documentElement.getAttribute("data-route");
        var p = location.pathname.replace(/\/+$/, "") || "/";
        if (r && r !== p) {
          document.documentElement.classList.add("spa-fallback");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
